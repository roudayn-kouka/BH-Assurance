name: Wave 3 sales recommendation pilot

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  staging-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r scripts/staging-requirements.txt
      - run: python -m pip check
      - run: env -i PATH="$PATH" python -B scripts/check_grounded_recommendation.py
      - name: Install Chromium and prefetch disposable MongoDB
        run: |
          npm install --prefix "$RUNNER_TEMP/bh-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/bh-browser/node_modules/.bin/playwright" install --with-deps chromium
          docker pull mongo:7.0@sha256:884c055bff8b7144ca44830d01826facd3083b33c4dea44b94a1476c62de3c32
      - name: Verify generated sales drafts in the existing review dashboard
        run: |
          NODE_PATH="$RUNNER_TEMP/bh-browser/node_modules" \
            bash scripts/check_dashboard_review.sh "$(command -v python)" --staging-ci
